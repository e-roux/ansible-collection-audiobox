---
# Molecule converge playbook for asset_upnp role -- real download
# Requires: ASSET_UPNP_ORDER_NUMBER environment variable

- name: Converge
  hosts: test_instances

  tasks:
    - name: Create download cache directory
      ansible.builtin.file:
        path: /var/cache/asset-upnp/downloads
        state: directory
        mode: "0755"

    - name: Include the asset_upnp role
      ansible.builtin.include_role:
        name: "{{ playbook_dir | dirname | dirname }}"
      vars:
        asset_upnp_service_started: false
