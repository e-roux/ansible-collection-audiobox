---
- name: Initialize reachable radios list
  ansible.builtin.set_fact:
    mediaplayer_reachable_radios: []

- name: Validate radios
  when: mediaplayer_radios is defined and mediaplayer_radios | length > 0
  block:
    - name: Check if radio stream URLs are reachable
      ansible.builtin.uri:
        url: "{{ item.stream }}"
        method: HEAD
        return_content: false
        status_code: 200
        timeout: 5
      loop: "{{ mediaplayer_radios | default([]) }}"
      loop_control:
        label: "{{ item.name }} (stream)"
      register: mediaplayer_stream_results
      ignore_errors: true

    - name: Check if radio image URLs are reachable
      ansible.builtin.uri:
        url: "{{ item.img }}"
        method: HEAD
        return_content: false
        status_code: 200
        timeout: 5
      loop: "{{ mediaplayer_radios | default([]) }}"
      loop_control:
        label: "{{ item.name }} (image)"
      register: mediaplayer_image_results
      ignore_errors: true

    - name: Filter valid radios
      ansible.builtin.set_fact:
        mediaplayer_reachable_radios: "{{ mediaplayer_reachable_radios + [item.0] }}"
      when:
        - item.1.status == 200
        - item.2.status == 200
      loop: "{{ mediaplayer_radios | zip(mediaplayer_stream_results.results, mediaplayer_image_results.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"

    - name: Report validation results
      ansible.builtin.debug:
        msg: "Found {{ mediaplayer_reachable_radios | length }} valid radios out of {{ mediaplayer_radios | length }}"

    - name: Generate RadioList.json
      ansible.builtin.template:
        src: radios/tunein.j2
        dest: "{{ mediaplayer_install_location }}/mediaplayer/RadioList.json"
        owner: "{{ mediaplayer_user_name }}"
        group: "{{ mediaplayer_user_group }}"
        mode: "0640"
      vars:
        radios: "{{ mediaplayer_reachable_radios }}"
      notify:
        - "Restart service {{ mediaplayer_service_name }}"
