---
- name: Verify
  hosts: all
  tasks:
    - name: Check if mediaplayer user exists
      ansible.builtin.command:
        cmd: id mediaplayer
      register: mediaplayer_user
      changed_when: false

    - name: Assert mediaplayer user exists
      ansible.builtin.assert:
        that:
          - mediaplayer_user.rc == 0
        fail_msg: "mediaplayer user does not exist"
        success_msg: "mediaplayer user exists"

    - name: Check if required packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - "'default-jre-headless' in ansible_facts.packages or 'default-jre' in ansible_facts.packages or 'openjdk-17-jre-headless' in ansible_facts.packages or 'openjdk-17-jre' in ansible_facts.packages"
          - "'mpd' in ansible_facts.packages"
          - "'mpc' in ansible_facts.packages"
        fail_msg: "Required packages are not installed"
        success_msg: "All required packages are installed"

    - name: Check if mediaplayer directory exists
      ansible.builtin.stat:
        path: /opt/mediaplayer
      register: mediaplayer_dir

    - name: Assert mediaplayer directory exists
      ansible.builtin.assert:
        that:
          - mediaplayer_dir.stat.exists
          - mediaplayer_dir.stat.isdir
        fail_msg: "mediaplayer directory does not exist"
        success_msg: "mediaplayer directory exists"

    - name: Check if mediaplayer jar exists
      ansible.builtin.stat:
        path: /opt/mediaplayer/MediaPlayer.jar
      register: mediaplayer_jar

    - name: Assert mediaplayer jar exists
      ansible.builtin.assert:
        that:
          - mediaplayer_jar.stat.exists
        fail_msg: "MediaPlayer.jar does not exist"
        success_msg: "MediaPlayer.jar exists"

    - name: Check if app.properties exists
      ansible.builtin.stat:
        path: /opt/mediaplayer/app.properties
      register: app_properties

    - name: Assert app.properties exists
      ansible.builtin.assert:
        that:
          - app_properties.stat.exists
        fail_msg: "app.properties does not exist"
        success_msg: "app.properties exists"

    - name: Check if RadioList.json exists
      ansible.builtin.stat:
        path: /opt/mediaplayer/RadioList.json
      register: radio_list

    - name: Assert RadioList.json exists
      ansible.builtin.assert:
        that:
          - radio_list.stat.exists
        fail_msg: "RadioList.json does not exist"
        success_msg: "RadioList.json exists"

    - name: Read RadioList.json content
      ansible.builtin.slurp:
        src: /opt/mediaplayer/RadioList.json
      register: radio_list_content

    - name: Parse RadioList.json
      ansible.builtin.set_fact:
        radio_list_parsed: "{{ radio_list_content['content'] | b64decode | from_json }}"

    - name: Display RadioList.json content
      ansible.builtin.debug:
        var: radio_list_parsed

    - name: Assert RadioList.json has correct structure
      ansible.builtin.assert:
        that:
          - radio_list_parsed.radios is defined
          - radio_list_parsed.radios | length > 0
          - radio_list_parsed.radios[0].name is defined
          - radio_list_parsed.radios[0].stream is defined
        fail_msg: "RadioList.json does not have the correct structure"
        success_msg: "RadioList.json has the correct structure"

    - name: Check if systemd service file exists
      ansible.builtin.stat:
        path: /lib/systemd/system/mediaplayer.service
      register: service_file

    - name: Assert systemd service file exists
      ansible.builtin.assert:
        that:
          - service_file.stat.exists
        fail_msg: "mediaplayer.service file does not exist"
        success_msg: "mediaplayer.service file exists"

    - name: Check systemd service file content
      ansible.builtin.slurp:
        src: /lib/systemd/system/mediaplayer.service
      register: service_content

    - name: Display service file content
      ansible.builtin.debug:
        msg: "{{ service_content['content'] | b64decode }}"

