---
- name: Prepare RPi4 test environment
  hosts: all
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'
      
    - name: Install basic dependencies
      ansible.builtin.package:
        name:
          - curl
          - python3
          - python3-pip
          - systemd
        state: present
        
    - name: Install python-gpiozero (will work in mock mode)
      ansible.builtin.pip:
        name: gpiozero
        state: present