---
dependency:
  name: shell
  command: /usr/bin/true
driver:
  name: podman
platforms:
  - name: rpi4-test
    dockerfile: Containerfile
    image: arm64v8/debian:trixie
    systemd: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      /run: "size=100m,noexec"
      /tmp: "size=100m"
    capabilities:
      - SYS_ADMIN
    command: /lib/systemd/systemd
    environment:
      DEBIAN_FRONTEND: noninteractive
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible/tmp
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
    prepare: prepare.yml
scenario:
  name: rpi4
verifier:
  name: testinfra
lint: |
  set -e
  yamllint .
  ansible-lint .