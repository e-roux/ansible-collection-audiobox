---
# Molecule configuration for gerbera role testing
# Ansible-Native Configuration (MANDATORY) - no legacy driver/platforms

dependency:
  name: galaxy
  enabled: false

shared_state: true

ansible:
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory/
  env:
    ANSIBLE_FORCE_COLOR: true
  cfg:
    defaults:
      host_key_checking: false
      remote_tmp: /tmp/.ansible/tmp
      pipelining: true
      fact_caching: memory
  playbooks:
    create: create.yml
    destroy: destroy.yml
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
    prepare: prepare.yml
    verify: verify.yml

scenario:
  name: default
  test_sequence:
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
