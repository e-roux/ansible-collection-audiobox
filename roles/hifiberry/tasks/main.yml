---
- name: Setup firmware
  notify:
    - Reboot System
  block:
    - name: Make sure audio is disabled
      ansible.builtin.lineinfile:
        path: "{{ hifiberry_config_path }}"
        line: dtparam=audio=on
        state: absent

    - name: Make sure audio is also disabled on vc4-fkms-v3d overlay
      ansible.builtin.lineinfile:
        path: "{{ hifiberry_config_path }}"
        regexp: ^(dtoverlay=vc4-kms-v3d).*
        line: \g<1>,noaudio
        backrefs: true

    - name: Make sure hifi berry overlay is present
      ansible.builtin.lineinfile:
        path: "{{ hifiberry_config_path }}"
        line: "dtoverlay={{ hifiberry_overlay }}"
        state: present

- name: Install asound.conf
  ansible.builtin.template:
    src: "{{ role_path }}/files/asound.conf"
    dest: "/etc/asound.conf"
    owner: "{{ hifiberry_owner }}"
    group: "{{ hifiberry_group }}"
    mode: "0640"

- name: Setup bluetooth
  block:
    - name: Start and enable Bluetooth service
      ansible.builtin.systemd:
        name: bluetooth
        enabled: true
        state: started
