---
extends: default

ignore-from-file:
  - .gitignore

rules:
  line-length:
    max: 200
    level: error
  document-start:
    present: true
    level: error
  comments-indentation: false
  comments:
    min-spaces-from-content: 1
    level: error
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
