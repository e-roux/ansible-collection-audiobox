issues: https://github.com/e-roux/ansible-collection-audiobox/issues

build_ignore:
  - ".ansible"
  - ".molecule"
  - ".pytest_cache"
  - ".ruff_cache"
  - "*.tar.gz"
  - "roles/*/molecule"
