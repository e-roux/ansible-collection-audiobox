[project]
name = "ansible-collection-audiobox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ansible>=11.3.0",
    "ansible-creator>=25.0.0",
    "ansible-dev-tools>=25.2.1",
    "ansible-lint>=25.1.3",
    "jmespath>=1.0.1",
    "keyring>=25.6.0",
    "molecule-plugins[podman]>=23.7.0",
    "pytest>=8.3.4",
    "testinfra>=6.0.0",
]

[tool.ruff]
cache-dir = "./.cache/ruff"

[tool.pytest.ini_options]
# addopts = ["-vvv", "-n", "2", "--log-level", "WARNING", "--color", "yes"]
cache_dir = "./.cache/pytest"
filterwarnings = ['ignore:AnsibleCollectionFinder has already been configured']
testpaths = ["test"]

[dependency-groups]
dev = [
    "coverage>=7.6.12",
 "pytest>=8.3.4",
 "pytest-xdist",
 "ruff>=0.9.7",
 "yamllint>=1.37.0",
]
